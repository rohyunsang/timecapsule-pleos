/button></div><p class="block-note">나만 공개한 캡슐은 동기화해도 가족에게 공개되지 않아요.</p></section><section class="block"><div class="progress" role="progressbar" aria-label="캡슐 동기화" aria-valuenow="2" aria-valuemax="3"><span class="is-on"></span><span class="is-on"></span><span></span></div><p class="block-note">앱을 닫아도 기기의 원본은 그대로 남아요.</p><a class="btn secondary full" href="sync.html">나중에 이어하기</a></section></main><div class="cta"><a class="btn primary full" href="sync-done.html">계속 기다리기</a></div></body></html>
