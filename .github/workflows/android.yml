name: 차량 및 모바일 검증

on:
  pull_request:
    branches: [main, integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: 빌드·테스트·렌더링·lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Java 21 설정
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK 35 준비
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: 두 앱과 공통 정책 검증
        run: >-
          bash ./gradlew --no-daemon
          :app:assembleDebug :mobile:assembleDebug
          :app:verifyPaparazziDebug :shared:testDebugUnitTest :mobile:verifyPaparazziDebug
          :app:lintDebug :shared:lintDebug :mobile:lintDebug
      - name: 검증 보고서 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-validation-reports
          retention-days: 7
          path: |
            app/build/reports/
            shared/build/reports/
            mobile/build/reports/
            app/build/test-results/
            shared/build/test-results/
            mobile/build/test-results/
